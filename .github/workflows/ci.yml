name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `docker build --target test` only runs the RUN layers, so on its own it
      # checks formatting and never executes a single test — CMD is not run during
      # a build. Tag the stage, then actually run the suite in a container.
      - name: Build test image (also runs mix format --check-formatted)
        run: |
          docker build \
            --target test \
            --progress=plain \
            --load \
            -t leywn-test:ci \
            -f Dockerfile \
            .

      - name: Run test suite
        run: docker run --rm leywn-test:ci mix test
